name: Update website

on:
  release:
    types:
      - published
      - deleted
      - edited

jobs:
  update_website:
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Update website on release
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: Deploy
          repo: anikku-app/anikku-app.github.io
          ref: "refs/heads/master"
          token: "${{ secrets.BOT_PAT }}"
