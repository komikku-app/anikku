org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

kotlin.code.style=official

# ---- App Version (override with -Pversion=X.Y.Z) ----
appVersion=1.0.1
appVersionName=1.0.1

# ---- Subtitle provider credentials (baked into the app) -------------------
# Free keys so end users don't configure anything:
#   - Jimaku token:     https://jimaku.cc/account  (free)
#   - OpenSubtitles:    https://opensubtitles.com API consumer + free account
# Keys are baked into the release binary. Users can still override them in
# Settings (stored in the Keychain). Note: all users share these quotas
# (Jimaku free tier + OpenSubtitles ~10 downloads/day per account).
subtitle.jimakuToken=
subtitle.opensubtitles.apiKey=
subtitle.opensubtitles.username=
subtitle.opensubtitles.password=
